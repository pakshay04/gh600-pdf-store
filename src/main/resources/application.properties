spring.application.name=pdf-pay-download

# Load local Razorpay test credentials when present. Environment variables can still override them.
spring.config.import=optional:classpath:application-local.properties
server.port=8080

# Admin credentials: environment variables override these development defaults.
# For production, ALWAYS set ADMIN_USERNAME and ADMIN_PASSWORD as environment variables.

spring.datasource.url=jdbc:h2:file:./data/db/pdfpay;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.storage.path=./data/uploads
app.download.token-minutes=30
app.default-price-paise=4900

# Razorpay TEST MODE - replace these values with your Test API keys.
# NEVER put the key secret in JavaScript.
# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:#{null}}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:#{null}}

# Optional free Google sign-in. Set GOOGLE_OAUTH_ENABLED=true and the two env vars after creating a Google OAuth Web Client.
google.oauth2.enabled=${GOOGLE_OAUTH_ENABLED:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
