<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | TechCertHub</title><link rel="stylesheet" href="/css/style.css"><style>.profile{max-width:900px;margin:60px auto;padding:0 22px}.profile-card{background:#fff;border:1px solid #e3e7ef;border-radius:28px;padding:35px;box-shadow:0 20px 60px rgba(20,25,45,.08)}.profile-head{display:flex;gap:20px;align-items:center}.big-avatar{width:82px;height:82px;border-radius:25px;display:grid;place-items:center;background:linear-gradient(135deg,#7655ff,#b6a5ff);color:white;font-size:32px;font-weight:900}.profile-head h1{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.stat{background:#f6f7fb;border-radius:16px;padding:20px}.stat b{display:block;font-size:28px}.muted{color:#748096}@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><a class="logo" href="/"><span>TC</span> TechCertHub</a><nav><a href="/community.html">Community</a><a href="/learn.html">Learn</a></nav></header><main class="profile"><div id="profile" class="profile-card">Loading profile…</div></main><script>const id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/community/users/'+id).then(r=>r.ok?r.json():Promise.reject()).then(u=>profile.innerHTML=`<div class="profile-head"><div class="big-avatar">${esc(u.name[0]?.toUpperCase())}</div><div><h1>${esc(u.name)}</h1><p class="muted">TechCertHub community member</p></div></div><div class="stats"><div class="stat"><span class="muted">Questions</span><b>${u.questions}</b></div><div class="stat"><span class="muted">Answers</span><b>${u.answers}</b></div><div class="stat"><span class="muted">Upvotes received</span><b>${u.upvotes}</b></div></div>`).catch(()=>profile.textContent='Profile not found.');</script></body></html>
