<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | TechCertHub</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>

<main class="page">

    <section class="admin-card">

        <div class="brand">

            <span class="badge">
                ADMIN
            </span>

            <h1>
                TechCertHub
            </h1>

        </div>


        <p class="muted">
            Sign in to manage your PDF products.
        </p>


        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus>


            <label for="password">
                Password
            </label>

            <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required>


            <button type="submit"
                    id="loginButton">

                Login

            </button>

        </form>


        <p id="loginMessage"
           class="message">
        </p>

    </section>

</main>


<script>

    async function getCsrfToken() {

        const response =
            await fetch('/admin/csrf', {
                credentials: 'same-origin'
            });

        if (!response.ok) {
            throw new Error(
                'Unable to initialize secure login.'
            );
        }

        const data =
            await response.json();

        return data.token;
    }


    document
        .getElementById('loginForm')
        .addEventListener('submit', async function(event) {

            event.preventDefault();

            const button =
                document.getElementById('loginButton');

            const message =
                document.getElementById('loginMessage');

            button.disabled = true;

            message.textContent = '';


            try {

                // Get CSRF token
                const csrfToken =
                    await getCsrfToken();


                const username =
                    document.getElementById('username').value;

                const password =
                    document.getElementById('password').value;


                const body =
                    new URLSearchParams();

                body.append(
                    'username',
                    username
                );

                body.append(
                    'password',
                    password
                );


                const response =
                    await fetch(
                        '/admin/login',
                        {
                            method: 'POST',

                            credentials: 'same-origin',

                            headers: {
                                'Content-Type':
                                    'application/x-www-form-urlencoded',

                                'X-XSRF-TOKEN':
                                    csrfToken
                            },

                            body: body
                        }
                    );


                if (response.ok || response.redirected) {

                    window.location.href =
                        '/admin.html';

                    return;
                }


                message.textContent =
                    'Invalid username or password.';

                button.disabled = false;

            } catch (error) {

                console.error(error);

                message.textContent =
                    error.message ||
                    'Login failed.';

                button.disabled = false;
            }

        });

</script>

</body>

</html>
