<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | TechCertHub</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<main class="page">

    <section class="admin-card">

        <div class="brand">
            <span class="badge">ADMIN</span>
            <h1>TechCertHub</h1>
        </div>

        <p class="muted">
            Sign in to manage your PDF products.
        </p>

        <form action="/admin/login"
              method="post"
              id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus>


            <label for="password">
                Password
            </label>

            <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required>


            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"
           class="message">

            <span id="errorMessage"></span>

        </p>

    </section>

</main>

<script>

    const params =
        new URLSearchParams(window.location.search);

    const error =
        params.get('error');

    const logout =
        params.get('logout');

    const message =
        document.getElementById('loginMessage');


    if (error) {

        message.textContent =
            'Invalid username or password.';

    }


    if (logout) {

        message.textContent =
            'You have been logged out.';

    }

</script>

</body>

</html>
